name: Android APK Build

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
      - 'The_Green_Grocery_Shop_POS__2_.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate packaged HTML JavaScript
        run: |
          node --input-type=commonjs -e "const fs=require('fs');const h=fs.readFileSync('android/app/src/main/assets/www/index.html','utf8');const m=[...h.matchAll(/<script\\b[^>]*>([\\s\\S]*?)<\\/script>/gi)].map(x=>x[1]).filter(x=>x.trim());if(!m.length)throw Error('No embedded JavaScript found');m.forEach((s,i)=>{new Function(s);console.log('Embedded script '+(i+1)+' syntax OK')});if(!h.trimEnd().endsWith('</html>'))throw Error('HTML document closing tag missing');"

      - name: Generate complete offline Tailwind CSS
        run: npx --yes tailwindcss@3.4.17 -c android/tailwind.config.cjs -i android/app/src/main/assets/www/tailwind.input.css -o android/app/src/main/assets/www/offline.css --minify

      - name: Verify offline logo fallback handling
        run: |
          test -s android/app/src/main/assets/www/index.html
          grep -q 'header-logo-fallback' android/app/src/main/assets/www/index.html

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build and inspect debug APK
        working-directory: android
        run: |
          gradle --no-daemon --stacktrace assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E 'assets/www/(index.html|offline.css|brand_logo.jpg)'
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: green-grocery-shop-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
